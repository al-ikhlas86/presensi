name: Build Presensi

# Compile TETAP tidak jalan tiap commit/push biasa (keputusan eksplisit user
# 2026-08-31, tidak diubah) - baru jalan otomatis kalau push GIT TAG berawalan
# "v" (mis. v1.4.0), yang berarti "versi ini siap dirilis ke kiosk sekolah".
# workflow_dispatch tetap ada utk build uji manual tanpa bikin Release/tag.
#
# Alur rilis: build (compile 2 target, zip masing2 hasilnya) -> release (bikin
# GitHub Release, tag jadi nomor versi) -> kiosk yang sudah terpasang otomatis
# cek rilis terbaru lewat GitHub REST API (repo ini privat, lihat
# UpdateService.cs utk alasannya) & pasang sendiri, TANPA installer & TANPA
# sentuhan manual apa pun di PC manapun. Tidak ada manifest terpisah lagi -
# app baca tag_name + daftar asset rilis langsung dari API, jadi nama asset
# zip di sini (Presensi-net48.zip / Presensi-net8.zip) HARUS SAMA PERSIS dgn
# AssetName di UpdateService.cs kalau mau diganti.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        # net48 = Windows 7 SP1 ke atas, net8.0-windows = Windows 10/11.
        # 1 codebase, 2 hasil build terpisah - lihat catatan multi-target
        # di Presensi.csproj.
        target: [net48, net8.0-windows]
    steps:
      - uses: actions/checkout@v5

      - name: Tentukan nomor versi dari tag git
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } else {
            # workflow_dispatch manual (bukan rilis resmi) - versi placeholder,
            # TIDAK dipublish sbg update krn langkah zip/release di bawah
            # cuma jalan utk push tag (lihat kondisi if masing2 step).
            $v = "0.0.0-dev"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Presensi/Presensi.csproj

      - name: Publish (net48)
        if: matrix.target == 'net48'
        run: dotnet publish src/Presensi/Presensi.csproj -c Release -f net48 -o publish/net48 -p:Version=${{ steps.version.outputs.version }}

      - name: Publish (net8.0-windows, self-contained win-x64)
        if: matrix.target == 'net8.0-windows'
        run: dotnet publish src/Presensi/Presensi.csproj -c Release -f net8.0-windows -r win-x64 --self-contained true -p:PublishReadyToRun=false -p:Version=${{ steps.version.outputs.version }} -o publish/net8.0-windows

      # Folder mentah ini SENGAJA cuma diupload utk build manual
      # (workflow_dispatch, dipakai developer debug) - dulu diupload SELALU
      # termasuk saat rilis bertag, hasilnya halaman Actions rilis resmi
      # menampilkan 4 artifact sekaligus (2 mentah + 2 zip) dan bikin bingung
      # "download yang mana" (dilaporkan user 2026-09-01). Rilis bertag
      # sekarang cuma tampilkan yang relevan (zip, diteruskan ke Releases).
      - name: Upload artifact (folder mentah, dipakai debug manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: Presensi-${{ matrix.target }}
          path: publish/${{ matrix.target }}
          retention-days: 3

      # Langkah di bawah ini (zip + upload utk Release) SENGAJA cuma jalan
      # kalau dipicu tag - build manual (workflow_dispatch) berhenti di
      # artifact folder mentah di atas, tidak ikut terbit sbg Release.
      - name: Bikin zip hasil publish (diunduh app via GitHub API - UpdateService.cs)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $suffix = if ($target -eq 'net48') { 'net48' } else { 'net8' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish\$target\*" -DestinationPath "dist\Presensi-$suffix.zip" -Force

      # retention-days DIPERPENDEK dari 90 hari jadi 1 (2026-09-11 - pola
      # SAMA PERSIS DataMaster, lihat komentar panjang di build.yml repo itu:
      # kuota storage Actions BENAR2 penuh, memblokir rilis DataMaster gagal
      # terbit - artifact ini cuma jembatan sementara build->release job DALAM
      # 1 run, begitu Release terbit isinya 100% berlebihan drpd salinan
      # permanen di GitHub Releases yang tidak kena kuota Actions ini.
      - name: Upload zip (utk dipublish job release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: Presensi-Zip-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Presensi-Zip-net48
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: Presensi-Zip-net8.0-windows
          path: dist

      # Tidak ada manifest XML lagi - UpdateService.cs di app baca tag_name +
      # daftar asset rilis ini LANGSUNG lewat GitHub REST API (perlu token,
      # krn repo privat), jadi cukup pastikan nama file zip di sini konsisten.
      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Presensi ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*.zip

  # Artefak build (folder mentah + zip rilis) MEMAKAN KUOTA STORAGE GitHub
  # Actions - jatah 500 MB paket Free, gabungan LINTAS SEMUA repo privat di
  # akun ini (dikonfirmasi 2026-09-02 lewat github.com/settings/billing).
  # Terukur 2026-09-02: 38 artefak / ~4,1 GB numpuk cuma dari repo INI
  # sendiri, jauh di atas jatah.
  #
  # Simpan 3 RUN terbaru (log + artefaknya - satu paket), sisanya dihapus -
  # ini TIDAK menyentuh GitHub Release dengan sendirinya (dibuktikan langsung
  # 2026-09-02 - run v1.4.2 sempat dibiarkan utuh sementara Release-nya
  # sendiri sudah tidak ada lebih dulu krn sebab lain, yaitu dihapus MANUAL,
  # bukan otomatis oleh workflow ini).
  #
  # SELAIN itu (langkah kedua di bawah, ditambah 2026-09-09): daftar Release
  # itu SENDIRI juga dibatasi 3 terbaru sekarang - rilis lama otomatis
  # dihapus (Release + tag git-nya) begitu rilis baru ke-4 terbit, supaya
  # halaman Releases tidak menumpuk terus tanpa batas. AMAN krn
  # UpdateService.cs SELALU menarik release "latest" lewat API - tidak
  # pernah merujuk versi lama yang sengaja dihapus ini.
  #
  # Job TERPISAH (bukan langkah di job release) + if: always() supaya tetap
  # jalan walau build/release gagal di tengah jalan - justru saat itu
  # storage paling gampang menumpuk.
  cleanup:
    needs: [build, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # Menghapus run lewat API butuh actions:write - job lain (build,
      # release) sengaja TIDAK diberi ini (prinsip izin seminim mungkin),
      # cuma job ini yang perlu.
      actions: write
      # contents: write WAJIB utk hapus Release/tag lama di step kedua di
      # bawah (ditambah 2026-09-09, pola sama diterapkan di DataMaster).
      contents: write
    steps:
      # KOREKSI 2026-09-12 (revisi ke-4 - kembali ke simpan-2, permintaan
      # eksplisit user setelah repo ini jadi PUBLIC: Actions Artifacts/Cache
      # gratis tak terbatas utk repo public, tidak perlu sehemat mungkin lagi
      # spt saat masih private/kena limit storage - lihat catatan lengkap
      # logika self-reference di build.yml DataMaster). Utk steady-state 2,
      # `tail -n +2` (skip 1, hapus sisanya).
      - name: Bersihkan run build lama (simpan 2 terbaru)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | "\(.created_at) \(.id)"' \
            | sort -r | tail -n +2 | awk '{print $2}' \
            | while read -r id; do
                echo "hapus run lama id=$id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
              done

      # Rilis (Release + tag git-nya) SENGAJA JUGA dibatasi (bukan dihapus
      # semua). AMAN krn UpdateService.cs SELALU menarik "latest" release
      # lewat API - kiosk manapun yang sudah ter-update tidak pernah merujuk
      # versi lama lagi. Dikembalikan ke simpan-2 (2026-09-12, repo sudah
      # public, tidak perlu sehemat mungkin lagi).
      - name: Bersihkan Release lama (simpan 2 terbaru)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | while read -r tag; do
                echo "hapus release+tag lama: $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
              done
